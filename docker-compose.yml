services:
  app:
    build:
      context: .
      dockerfile: server/Dockerfile.cpu
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Host Ettin CE when rerank_enabled=true in config.yaml
      - RERANK_URL=http://host.docker.internal:7997
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./server/config.yaml:/app/server/config.yaml:ro
      - ./prompts:/app/prompts:ro
      - ./voices:/app/voices:ro
      - ./server/static:/app/server/static:ro
      - hf_cache:/root/.cache/huggingface

volumes:
  hf_cache:
