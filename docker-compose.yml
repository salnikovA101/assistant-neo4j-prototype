services:
  app:
    build:
      context: .
      dockerfile: server/Dockerfile.cpu
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Used when rerank_enabled=true. Hostname exists only if profile `rerank` is up.
      - RERANK_URL=http://reranker:7997
      - APP_DB_PATH=/app/data/assistant.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./server/config.yaml:/app/server/config.yaml:ro
      - ./prompts:/app/prompts:ro
      - ./voices:/app/voices:ro
      - ./server/static:/app/server/static:ro
      - assistant_data:/app/data
      - hf_cache:/root/.cache/huggingface

  # Not started by `docker compose up`. Enable with `--profile rerank`.
  # CPU default (this Dockerfile). GPU later: Dockerfile.gpu + a separate profile.
  reranker:
    profiles: ["rerank"]
    container_name: reranker
    build:
      context: .
      dockerfile: reranker/Dockerfile
    restart: unless-stopped
    expose:
      - "7997"
    volumes:
      - reranker_hf_cache:/root/.cache/huggingface

volumes:
  assistant_data:
  hf_cache:
  reranker_hf_cache:
