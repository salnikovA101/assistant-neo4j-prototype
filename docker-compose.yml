services:
  app:
    build:
      context: .
      dockerfile: server/Dockerfile.cpu
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006
      # Host Ettin CE (scripts/serve_ettin_reranker.py --host 0.0.0.0 --port 7997)
      - RERANK_URL=http://host.docker.internal:7997
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./server/config.yaml:/app/server/config.yaml:ro
      - ./prompts:/app/prompts:ro
      - ./voices:/app/voices:ro
      - ./server/static:/app/server/static:ro
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - phoenix

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
    environment:
      - PHOENIX_WORKING_DIR=/data
    volumes:
      - phoenix_data:/data

volumes:
  hf_cache:
  phoenix_data:
