debug_mode: false
audio_enabled: false
# Corpus for ANN/bridges (relationship.run_id). Empty = whole vector index + warning.
run_id: "full_corpus_20260713"
rerank_enabled: false
staged_enabled: true
cards_enabled: true

server:
  host: "0.0.0.0"
  port: 8000
  llm_timeout: 3000

stt:
  model: "base"
  device: "cpu"
  compute_type: "int8"
  language: "ru"

tts:
  mode: "quality"
  speed:
    silero_speaker: "baya"
    sample_rate: 24000
    language: "ru"
    speaker_type: "v5_ru"
    device: "cuda"
    speaker_name: "baya"
  quality:
    model: "Qwen/Qwen3-TTS-12Hz-0.6B-Base"
    device: "cuda"
    attn_implementation: "sdpa"
    max_seq_len: 2048
    ref_voice: "voices/example.wav"
    ref_text: "Буду, получается, проходить сюжетку Пылью, Женщиной-пауком, ну или какими-нибудь другими супергероями. И, в общем-то, надеюсь, всё получится. Погнали!"
    language: "Russian"
    chunk_size: 4
  cloud:
    model: "openai/gpt-4o-mini-tts-2025-12-15"
    voice: "alloy"

# Algorithm knobs (L, effort K, rerank_url, …) live in server/algorithm/params.py.
# Deploy switches: run_id and rerank_enabled at the top of this file.
# Embeddings: local Ollama embeddinggemma:300m-qat-q8_0 (EMBED__* in .env, not yaml).
llm:
  current_profile: "auto"
  tool_profile: "ollama"
  fallback_profile: "ollama"
  auto_order:
    - qwen38_max
    - qwen38_2_4t
    - deepseek_v4_pro
    - kimi_k3
    - glm_52
    - qwen37_max
    - qwen38_27b
    - qwen38_flash
    - qwen37_plus
    - qwen37_flash
  ui_profiles:
    - auto
    - qwen38_max
    - qwen38_2_4t
    - deepseek_v4_pro
    - kimi_k3
    - glm_52
    - qwen37_max
    - qwen38_27b
    - qwen38_flash
    - qwen37_plus
    - qwen37_flash
  prompt_folder: "prompts"
  profiles:
    ollama:
      provider: "openai"
      model: "gemma4:31b-cloud"
      display_name: "Gemma 4 31B"
      base_url: "https://ollama.com/v1"
      temperature: 1.0
      top_p: 0.95
      top_k: 64
      max_output_tokens: 16384
      max_turns: 2
      think: true
      think_effort: "high"
      # Gemma 4 31B: binary thinking. UI "off" is sent as reasoning_effort=none.
      think_efforts: ["high", "off"]
      preserve_thinking: true
    ollama_gptoss:
      provider: "openai"
      model: "gpt-oss:120b-cloud"
      display_name: "GPT-OSS 120B"
      # api_key / base_url inherited from ollama (LLM__PROFILES__OLLAMA__*).
      temperature: 1.0
      top_p: 1.0
      max_output_tokens: 16384
      max_turns: 2
      think: true
      think_effort: "high"
      # gpt-oss: thinking cannot be disabled. UI has no "off".
      think_efforts: ["low", "medium", "high"]
    # Credential parent for DashScope (LLM__PROFILES__QWEN_CLOUD__*). Not in the UI.
    qwen_cloud:
      provider: "openai"
      model: "qwen3.8-27b"
      display_name: "Qwen 3.8 27B"
      base_url: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
      temperature: 0.7
      top_p: 0.80
      top_k: 20
      min_p: 0.0
      presence_penalty: 1.5
      repetition_penalty: 1.0
      max_output_tokens: 32768
      context_window: 262144
      max_turns: 2
      think: true
      think_family: qwen38
      think_effort: "medium"
      think_efforts: ["low", "medium", "xhigh", "off"]
      preserve_thinking: true
    qwen38_flash:
      provider: "openai"
