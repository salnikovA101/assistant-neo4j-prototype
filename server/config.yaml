debug_mode: false
audio_enabled: false
# Corpus for V6 ANN/bridges (relationship.run_id). Empty = whole vector index + warning.
run_id: "full_corpus_20260713"
rerank_enabled: false

server:
  host: "0.0.0.0"
  port: 8000
  llm_timeout: 3000

stt:
  model: "base"
  device: "cpu"
  compute_type: "int8"
  language: "ru"

tts:
  mode: "quality"
  speed:
    silero_speaker: "baya"
    sample_rate: 24000
    language: "ru"
    speaker_type: "v5_ru"
    device: "cuda"
    speaker_name: "baya"
  quality:
    model: "Qwen/Qwen3-TTS-12Hz-0.6B-Base"
    device: "cuda"
    attn_implementation: "sdpa"
    max_seq_len: 2048
    ref_voice: "voices/example.wav"
    ref_text: "Буду, получается, проходить сюжетку Пылью, Женщиной-пауком, ну или какими-нибудь другими супергероями. И, в общем-то, надеюсь, всё получится. Погнали!"
    language: "Russian"
    chunk_size: 4
  cloud:
    model: "openai/gpt-4o-mini-tts-2025-12-15"
    voice: "alloy"

# Algorithm knobs (L, effort K, rerank_url, …) live in server/algorithm/params.py.
# Deploy switches: run_id and rerank_enabled at the top of this file.
# V6 embeddings: hardcoded OpenRouter nemotron in server/algorithm/embed.py (not yaml).
llm:
  current_profile: "other"
  tool_profile: "other"
  history_len: 30
  prompt_folder: "prompts"
  profiles:
    other:
      provider: "openai"
      model: "qwen/qwen3.8-27b" #Локально
      temperature: 0.7
      top_p: 0.80
      top_k: 20
      min_p: 0.0
      presence_penalty: 1.5
      repetition_penalty: 1.0
      max_output_tokens: 32768
      # Бюджет одного ответа: 2 tool-хода = 2 поиска ask_subgraph.
      max_turns: 2
      think: true
      think_effort: "xhigh"
      preserve_thinking: true
    lm_studio:
      provider: "openai"
      model: "google/gemma-4-12b-qat"
      base_url: "http://host.docker.internal:1234/v1"
      temperature: 1.0
      top_p: 0.95
      top_k: 64
      max_output_tokens: 16384
      max_turns: 2
      think: true
      think_effort: "high"
      preserve_thinking: true
      # Gemma: без этого токена в system думает только до tool call, после — reasoning_tokens=0
      think_token: "<|think|>"
    ollama:
      provider: "openai"
      model: "gemma4:31b-cloud"
      base_url: "https://ollama.com/v1"
      temperature: 1.0
      top_p: 0.95
      top_k: 64
      max_output_tokens: 16384
      max_turns: 2
      think: true
      think_effort: "high"
      preserve_thinking: true
