<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#212121">
    <title>Neo4j Assistant</title>
    <meta name="description" content="ИИ-ассистент для работы с графовой базой знаний Neo4j">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Main Panel -->
        <div id="main-content">
            <!-- Header/Top Bar -->
            <header id="top-bar">
                <div class="model-selector" id="model-picker">
                    <button type="button" id="model-btn" class="model-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="model-menu" title="Модель">
                        <span id="model-name" class="model-name">Neo4j Assistant</span>
                        <svg class="effort-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                    <div class="effort-menu model-menu" id="model-menu" hidden role="listbox" aria-labelledby="model-btn">
                        <div class="effort-menu-title">Модель</div>
                    </div>
                </div>
                <div class="header-controls">
                    <div class="header-status-wrapper">
                        <span id="db-status-text">Подключение...</span>
                        <div class="header-indicator" id="connection-dot" title="Статус сервера"></div>
                    </div>
                    <div class="settings-picker" id="settings-picker">
                        <button id="settings-btn" type="button" title="Настройки" aria-label="Настройки" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings-menu">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="12" cy="12" r="3"></circle>
                                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                            </svg>
                        </button>
                        <div class="settings-menu" id="settings-menu" hidden role="dialog" aria-labelledby="settings-key-title">
                            <div class="settings-menu-title" id="settings-key-title">Ключи API</div>
                            <div class="settings-key-block">
                                <label class="settings-key-label" for="settings-key-input-ollama">Ключ Ollama</label>
                                <p class="settings-key-status" id="settings-key-status-ollama">Сейчас: из конфига</p>
                                <input id="settings-key-input-ollama" class="settings-key-input" type="password" autocomplete="off" spellcheck="false" placeholder="Вставьте ключ">
                                <div class="settings-menu-actions">
                                    <button type="button" id="settings-key-save-ollama" class="settings-action-primary" data-key-family="ollama">Сохранить</button>
                                    <button type="button" id="settings-key-clear-ollama" class="settings-action-ghost" data-key-family="ollama">Сбросить</button>
                                </div>
                            </div>
                            <div class="settings-key-block">
                                <label class="settings-key-label" for="settings-key-input-qwen">Ключ Qwen Cloud</label>
                                <p class="settings-key-status" id="settings-key-status-qwen">Сейчас: из конфига</p>
                                <input id="settings-key-input-qwen" class="settings-key-input" type="password" autocomplete="off" spellcheck="false" placeholder="Вставьте ключ">
                                <div class="settings-menu-actions">
                                    <button type="button" id="settings-key-save-qwen" class="settings-action-primary" data-key-family="qwen">Сохранить</button>
                                    <button type="button" id="settings-key-clear-qwen" class="settings-action-ghost" data-key-family="qwen">Сбросить</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button id="clear-btn" type="button" title="Очистить историю" aria-label="Очистить историю">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            <line x1="10" y1="11" x2="10" y2="17"></line>
                            <line x1="14" y1="11" x2="14" y2="17"></line>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Chat Container -->
            <main id="chat-messages">
                <div class="welcome-message">
                    <div class="welcome-logo"><img src="icon.svg" alt="" width="40" height="40"></div>
                    <h2>Чем я могу помочь?</h2>
                    <p>Задайте вопрос по базе знаний Neo4j — отвечу с опорой на граф и источники.</p>
                </div>
            </main>

            <!-- Input Panel -->
            <footer id="input-panel">
                <div class="input-container">
                    <button type="button" id="composer-reveal" class="composer-reveal" hidden aria-label="Открыть поле ввода">
                        Спросить Neo4j Assistant...
                    </button>
                    <div class="input-wrapper">
                        <!-- Mic / Stop / Pause button inside wrapper -->
                        <button id="mic-btn" type="button" hidden title="Голосовой ввод" aria-label="Микрофон">
                            <!-- Mic Icon -->
                            <svg id="mic-icon" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                            </svg>
                            <!-- Stop Icon (during recording) -->
                            <svg id="stop-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none">
                                <rect x="6" y="6" width="12" height="12" rx="2"/>
                            </svg>
                            <!-- Pause Icon (during playing) -->
                            <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none">
                                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                            </svg>
                            <div class="recording-pulse"></div>
                        </button>

                        <!-- Input field -->
                        <textarea id="text-input" rows="1" placeholder="Спросить Neo4j Assistant..." autocomplete="off" enterkeyhint="send"></textarea>

                        <div class="composer-actions">
                        <div class="effort-picker" id="depth-picker">
                            <button type="button" id="depth-btn" class="effort-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="depth-menu" title="Глубина поиска">
                                <svg class="effort-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <circle cx="11" cy="11" r="7"></circle>
                                    <path d="M20 20l-4.3-4.3"></path>
                                </svg>
                                <span id="depth-label">Обычно</span>
                                <svg class="effort-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <polyline points="6 9 12 15 18 9"></polyline>
                                </svg>
                            </button>
                            <div class="effort-menu" id="depth-menu" hidden role="listbox" aria-labelledby="depth-btn">
                                <div class="effort-menu-title">Глубина поиска</div>
                                <button type="button" class="effort-option" role="option" data-depth="low" aria-selected="false">
                                    <span class="effort-option-check" aria-hidden="true"></span>
                                    <span class="effort-option-text">
                                        <span class="effort-option-name">Узко</span>
                                        <span class="effort-option-hint">точный факт</span>
                                    </span>
                                </button>
                                <button type="button" class="effort-option" role="option" data-depth="medium" aria-selected="true">
                                    <span class="effort-option-check" aria-hidden="true"></span>
                                    <span class="effort-option-text">
                                        <span class="effort-option-name">Обычно</span>
                                        <span class="effort-option-hint">баланс</span>
                                    </span>
                                </button>
                                <button type="button" class="effort-option" role="option" data-depth="high" aria-selected="false">
                                    <span class="effort-option-check" aria-hidden="true"></span>
                                    <span class="effort-option-text">
                                        <span class="effort-option-name">Широко</span>
                                        <span class="effort-option-hint">перечень, сравнение</span>
                                    </span>
                                </button>
                            </div>
                        </div>

                        <div class="effort-picker" id="effort-picker">
                            <button type="button" id="effort-btn" class="effort-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="effort-menu" title="Глубина рассуждения">
                                <svg class="effort-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M12 3v3"></path>
                                    <path d="M18.4 6.6l-2.1 2.1"></path>
                                    <path d="M21 12h-3"></path>
                                    <path d="M18.4 17.4l-2.1-2.1"></path>
                                    <path d="M12 18v3"></path>
                                    <path d="M7.7 15.3l-2.1 2.1"></path>
                                    <path d="M6 12H3"></path>
                                    <path d="M7.7 8.7L5.6 6.6"></path>
                                    <circle cx="12" cy="12" r="3.2"></circle>
                                </svg>
                                <span id="effort-label">Глубоко</span>
                                <svg class="effort-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <polyline points="6 9 12 15 18 9"></polyline>
                                </svg>
                            </button>
                            <div class="effort-menu" id="effort-menu" hidden role="listbox" aria-labelledby="effort-btn">
                                <div class="effort-menu-title">Рассуждения</div>
                            </div>
                        </div>

                        <!-- Send button -->
                        <button id="send-btn" type="button" title="Отправить" aria-label="Отправить">
                            <svg id="send-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                            </svg>
                            <svg id="stop-gen-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none">
                                <rect x="6" y="6" width="12" height="12" rx="2"/>
                            </svg>
                        </button>
                        </div>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
